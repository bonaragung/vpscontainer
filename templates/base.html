<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#351000",
                        "inverse-on-surface": "#eef0ff",
                        "tertiary-container": "#a44100",
                        "secondary-fixed": "#d3e4fe",
                        "outline-variant": "#c7c4d8",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-secondary-fixed": "#0b1c30",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#0f0069",
                        "tertiary": "#7e3000",
                        "on-secondary-fixed-variant": "#38485d",
                        "surface-container-high": "#e2e7ff",
                        "surface-tint": "#4d44e3",
                        "on-primary-fixed-variant": "#3323cc",
                        "secondary": "#505f76",
                        "on-background": "#131b2e",
                        "outline": "#777587",
                        "primary": "#3525cd",
                        "surface-container": "#eaedff",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "tertiary-fixed": "#ffdbcc",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-surface": "#131b2e",
                        "inverse-primary": "#c3c0ff",
                        "surface-dim": "#d2d9f4",
                        "surface-bright": "#faf8ff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "background": "#faf8ff",
                        "inverse-surface": "#283044",
                        "on-primary-container": "#dad7ff",
                        "surface": "#faf8ff",
                        "surface-container-low": "#f2f3ff",
                        "surface-container-highest": "#dae2fd",
                        "on-error": "#ffffff",
                        "primary-fixed": "#e2dfff",
                        "on-tertiary-container": "#ffd2be",
                        "secondary-container": "#d0e1fb",
                        "primary-container": "#4f46e5",
                        "on-surface-variant": "#464555",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#54647a",
                        "surface-variant": "#dae2fd",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#ffb695"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "stack-lg": "24px",
                        "margin-page": "32px",
                        "container-max": "1280px",
                        "stack-xl": "48px",
                        "stack-xs": "4px",
                        "stack-md": "16px",
                        "unit": "4px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "inter": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "h2": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "h3": ["18px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "h1": ["30px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400"}],
                        "code": ["13px", {"lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "500"}],
                        "body-base": ["16px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <title>{% block title %}CloudStack VPS{% endblock %}</title>
</head>
<body class="bg-surface font-inter text-on-surface">
<!-- TopAppBar -->
<header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm docked full-width top-0 sticky z-40 flex justify-between items-center w-full px-6 h-16 font-inter antialiased">
    <div class="flex items-center gap-8">
        <span class="text-xl font-black tracking-tight text-slate-900 dark:text-white">CloudStack VPS</span>
        <div class="hidden md:flex items-center gap-6">
            <nav class="flex items-center gap-4">
                <a class="nav-dashboard text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors cursor-pointer active:opacity-80 px-3 py-2 rounded-lg text-sm font-medium" href="/">Dashboard</a>
                <a class="nav-monitor text-indigo-600 dark:text-indigo-400 font-semibold px-3 py-2 rounded-lg text-sm" href="/monitor">Monitoring</a>
                <a class="nav-manage text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors cursor-pointer active:opacity-80 px-3 py-2 rounded-lg text-sm font-medium" href="/manage">Manage</a>
            </nav>
        </div>
    </div>
    <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
            <button class="p-2 text-slate-500 hover:bg-slate-50 rounded-full transition-colors">
                <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
            </button>
            <button class="p-2 text-slate-500 hover:bg-slate-50 rounded-full transition-colors">
                <span class="material-symbols-outlined" data-icon="help">help</span>
            </button>
        </div>
        <div class="h-8 w-8 rounded-full bg-slate-200 overflow-hidden">
            <img alt="Administrator Avatar" class="h-full w-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBMAzQds0vCSIRB7FhTh0DOcXlSfwFJXaDdxh-T2h2070gedBTf013y7Bseg0rkUPwSQn-IHQgKKrvNiD8NyY4SzLK5n47W5hR1ms4vUpR46-drr7Y0kpi6wh9UmEgr5i9Ey2TUPhZFgnbfnUKrMvbTvWKW3hlglgrFC6NX3jlW_ry_XIn2WAlLYBitObq2kqbus1TJak0R4a6AhS4UWPVyxxQAdXhC7cOCs7qXNF4YVfKDaWD82iM0SfOr3tJc6Y0IhMk92MI4Fmc"/>
        </div>
    </div>
</header>
<!-- SideNavBar -->
<aside class="fixed left-0 top-16 h-[calc(100vh-64px)] w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col font-inter text-sm font-medium">
    <div class="p-6 border-b border-slate-200 dark:border-slate-800">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-primary-container flex items-center justify-center text-on-primary-container">
                <span class="material-symbols-outlined" data-icon="cloud">cloud</span>
            </div>
            <div>
                <div class="text-lg font-bold text-slate-900 dark:text-white leading-tight">CloudStack</div>
                <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">v2.4.0-stable</div>
            </div>
        </div>
    </div>
    <div class="flex-1 p-4 flex flex-col gap-1 overflow-y-auto">
        <a class="sidebar-dashboard flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/50 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all rounded-lg group" href="/">
            <span class="material-symbols-outlined group-hover:translate-x-1 duration-200" data-icon="grid_view">grid_view</span>
            <span>Dashboard</span>
        </a>
        <a class="sidebar-monitor flex items-center gap-3 px-3 py-2 bg-indigo-50 dark:bg-indigo-900/20 text-indigo-700 dark:text-indigo-300 border-r-2 border-indigo-600 group" href="/monitor">
            <span class="material-symbols-outlined group-hover:translate-x-1 duration-200" data-icon="monitoring">monitoring</span>
            <span>Monitoring</span>
        </a>
        <a class="sidebar-manage flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/50 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all rounded-lg group" href="/manage">
            <span class="material-symbols-outlined group-hover:translate-x-1 duration-200" data-icon="layers">layers</span>
            <span>Manage</span>
        </a>
        <a class="sidebar-images flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/50 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all rounded-lg group" href="/images">
            <span class="material-symbols-outlined group-hover:translate-x-1 duration-200" data-icon="image">image</span>
            <span>Images</span>
        </a>
        <div class="mt-8 px-3 mb-2 text-[11px] font-bold text-slate-400 uppercase tracking-wider">Actions</div>
        <a href="/" class="flex items-center justify-center gap-2 w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-sm transition-colors mb-4">
            <span class="material-symbols-outlined text-sm" data-icon="add">add</span>
            <span>Create VPS</span>
        </a>
    </div>
    <div class="p-4 border-t border-slate-200 dark:border-slate-800 flex flex-col gap-1">
        <a class="flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/50 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all rounded-lg group" href="#">
            <span class="material-symbols-outlined group-hover:translate-x-1 duration-200" data-icon="settings">settings</span>
            <span>Settings</span>
        </a>
        <form action="/logout" method="post" class="w-full">
            <button type="submit" class="w-full flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/50 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all rounded-lg group">
                <span class="material-symbols-outlined group-hover:translate-x-1 duration-200" data-icon="logout">logout</span>
                <span>Logout ({{ current_user }})</span>
            </button>
        </form>
    </div>
</aside>
<!-- Main Content Canvas -->
<main class="ml-64 p-8 min-h-[calc(100vh-64px)]">
    <div class="max-w-container-max mx-auto space-y-gutter">
        {% block content %}{% endblock %}
    </div>
</main>
{% block scripts %}{% endblock %}
</body>
</html>
