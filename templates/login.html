<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <title>Login - CloudStack VPS</title>
</head>
<body class="bg-slate-50 font-inter min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md px-6">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center">
                    <span class="material-symbols-outlined text-white text-3xl" data-icon="cloud">cloud</span>
                </div>
                <div class="text-left">
                    <div class="text-2xl font-black tracking-tight text-slate-900">CloudStack VPS</div>
                    <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">v2.4.0-stable</div>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Welcome Back</h1>
            <p class="text-body-sm text-slate-500 mt-1">Sign in to manage your VPS instances</p>
        </div>

        <!-- Login Form -->
        <div class="bg-white border border-slate-200 rounded-xl p-8 shadow-sm">
            {% if error_message %}
                <div class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg flex items-center gap-2">
                    <span class="material-symbols-outlined text-red-600 text-xl" data-icon="error">error</span>
                    <span class="text-body-sm text-red-800">{{ error_message }}</span>
                </div>
            {% endif %}

            <form method="post" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-body-sm font-medium text-slate-700" for="username">Username</label>
                    <input type="text" id="username" name="username" required
                        class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-body-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all"
                        placeholder="Enter your username">
                </div>

                <div class="space-y-1.5">
                    <label class="text-body-sm font-medium text-slate-700" for="password">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-body-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all"
                        placeholder="Enter your password">
                </div>

                <button type="submit"
                    class="w-full flex items-center justify-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-body-sm font-semibold shadow-sm transition-colors mt-6">
                    <span class="material-symbols-outlined text-sm" data-icon="login">login</span>
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-body-sm text-slate-500">
                    Default credentials: <code class="bg-slate-100 px-2 py-0.5 rounded text-slate-700">admin / admin123</code>
                </p>
            </div>
        </div>

        <p class="text-center text-body-sm text-slate-400 mt-6">
            © 2026 CloudStack VPS. All rights reserved.
        </p>
    </div>
</body>
</html>
